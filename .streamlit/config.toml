# Streamlit 主题（Apple 极简：白底、发丝线边框、12px 圆角、系统字体）
# 页面外观全部由本文件控制；app.py 中不写颜色与排版 CSS。
[theme]
base = "light"
primaryColor = "#0071e3"                 # 主色：Apple 蓝
backgroundColor = "#ffffff"              # 页面底色
secondaryBackgroundColor = "#f5f5f7"     # 控件/代码底色
textColor = "#1d1d1f"
borderColor = "#e8e8ed"                  # 发丝线卡片边框
baseRadius = "12px"                      # 卡片统一 12px 圆角（版式硬性要求）
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
font = "sans-serif"                      # 系统字体栈（苹方/微软雅黑）
headingFontSizes = ["34px", "22px", "17px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
metricValueFontSize = "2rem"             # KPI 大数字
metricValueFontWeight = 600
paddingTop = "3rem"
paddingBottom = "5rem"
chartCategoricalColors = ["#0071e3", "#34c759", "#ff9500", "#ff3b30", "#af52de", "#5ac8fa", "#ffcc00", "#8e8e93"]

[theme.sidebar]
paddingTop = "2.5rem"
paddingBottom = "2rem"
